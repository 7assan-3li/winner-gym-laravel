[global]
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192

[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 35
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 1000
pm.process_idle_timeout = 10s

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

listen.backlog = 1024

